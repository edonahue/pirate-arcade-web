<html lang="en-us">
  <!-- INLINE SCRIPT: must be BEFORE the pygbag module script -->
  <script>
    console.log('INLINE_SCRIPT: starting');

    // Replace pythons.js cross_file with a correct implementation.
    // Original has two bugs: missing return resp.arrayBuffer() in the .then chain,
    // and fetch hangs when init is a Python bridge JSHandle proxy (Firefox).
    (function() {
      var _origFetch = window.fetch.bind(window);
      var done = false;
      var check = setInterval(function() {
        if ((typeof FS !== 'undefined' || typeof window.FS !== 'undefined') && typeof window.cross_file === 'function' && !done) {
          clearInterval(check); done = true;
          var fs = typeof FS !== 'undefined' ? FS : window.FS;
          window.cross_file = function*(url, store, flags) {
            console.log('cross_file.patched', url);
            var content = 0;
            var error = null;
            _origFetch(url).then(function(resp) {
              if (!resp.ok) { error = new Error('HTTP ' + resp.status); return; }
              return resp.arrayBuffer();
            }).then(function(buf) {
              if (buf) content = new Uint8Array(buf);
            }).catch(function(err) {
              error = err;
            });
            while (!content && !error) { yield; }
            if (error) { console.error('cross_file.error', error.message, 'url=', url); throw error; }
            console.log('cross_file.patched.done', url, 'len=', content ? content.length : 0);
            if (content && content.length) {
              fs.writeFile(store, content);
            }
            yield store;
          };
        }
      }, 10);
      setTimeout(function() { clearInterval(check); }, 30000);
    })();

    console.log('INLINE_SCRIPT: cross_file replacement done');

    // Poll for Python interpreter and inject game startup code via blocks[0].
    console.log('INJECT_SCRIPT: setting up poll');
    (function() {
      var pyReady = setInterval(function() {
        if (typeof window.python === 'object' && window.python !== null && typeof window.python.PyRun_SimpleString === 'function') {
          clearInterval(pyReady);
          console.log('JS_INJECT: python ready, injecting startup code');

          var gameCode = [
            'import sys, asyncio, tarfile, io, os',
            '',
            'async def boot():',
            '    import __EMSCRIPTEN__ as platform',
            '    try:',
            '        platform.window.transfer.hidden = True',
            '        platform.window.canvas.style.visibility = "visible"',
            '        platform.window.infobox.innerText = "loading game..."',
            '',
            '        # Pre-install pygame wheel from CDN',
            '        import aio.pep0723',
            '        await aio.pep0723.pip_install("pygame")',
            '',
            '        # Fetch and extract game archive',
            '        url = platform.window.location.href + "cannonball-clash.tar.gz"',
            '        async with platform.fopen(url, "rb") as f:',
            '            data = f.read()',
            '        d = "/tmp/game_extract"',
            '        os.makedirs(d, exist_ok=True)',
            '        tarfile.open(fileobj=io.BytesIO(data)).extractall(d)',
            '',
            '        # Init pygame display, then import game modules',
            '        a = os.path.join(d, "assets")',
            '        sys.path.insert(0, a)',
            '        os.chdir(a)',
            '        import pygame as pg',
            '        pg.display.init()',
            '        pg.font.init()',
            '        import constants as c',
            '        s = pg.display.set_mode((c.WINDOW_WIDTH, c.WINDOW_HEIGHT))',
            '        pg.display.set_caption("Cannonball Clash")',
            '        from games.pong.game import PongGame',
            '',
            '        class DummyAudio:',
            '            muted = False',
            '            @staticmethod',
            '            def play(*a,**kw): pass',
            '            @staticmethod',
            '            def load(*a,**kw): pass',
            '',
            '        game = PongGame(s, DummyAudio())',
            '        platform.window.infobox.innerText = "Cannonball Clash loaded!"',
            '        await game.run()',
            '    except Exception as e:',
            '        sys.print_exception(e)',
            '        platform.window.infobox.innerText = "Error: " + str(e)',
            '',
            'asyncio.ensure_future(boot())',
          ].join('\n');
          window.python.FS.writeFile('/tmp/game.py', gameCode);
          window.python.script.blocks[0] = 'import sys;exec(open("/tmp/game.py").read())';
          console.log('JS_INJECT: wrote /tmp/game.py and set blocks[0]');
        }
      }, 100);
      setTimeout(function() { clearInterval(pyReady); }, 120000);
    })();

    console.log('INLINE_SCRIPT: all setup done');
  </script>

    function show_infobox() {
      infobox.style.display = 'block';
