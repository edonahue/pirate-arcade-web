name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Playwright tests — separate job so a test flake doesn't block the
  # build. Only chromium-desktop is run here; mobile-safari/mobile-chrome
  # and webkit-desktop are exercised locally before each release (see
  # TESTING.md and tests/TESTING_CHECKLIST.md).
  playwright:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Health/smoke tests (chromium-desktop)
        run: npx playwright test tests/browser-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Desktop input tests (chromium-desktop)
        run: npx playwright test tests/game-input-desktop.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Web-native game tests (chromium-desktop)
        run: npx playwright test tests/web-native-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Game prewarm tests (chromium-desktop)
        run: npx playwright test tests/game-prewarm.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 5
      - name: Captain's Log tests (chromium-desktop)
        run: npx playwright test tests/captains-log.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 3
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Static game-shell integrity check — validates encoding, structure, and
  # absence of leaked source code in raw HTML. No runtime or browser needed.
  shell-integrity:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Game shell source integrity check
        run: npm run test:game-shell-integrity

  # Cheap browser shell test — intercepts Pygbag runtime to test only
  # the static loading shell on chromium, WebKit mobile, and iPad.
  shell-test:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium + WebKit
        run: npx playwright install chromium webkit
      - name: Shell integrity tests (chromium)
        run: npx playwright test tests/game-shell-integrity.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 5
      - name: Shell integrity tests (mobile-safari)
        run: npx playwright test tests/game-shell-integrity.spec.ts --project=mobile-safari --reporter=list
        timeout-minutes: 5
      - name: Shell integrity tests (ipad-landscape)
        run: npx playwright test tests/game-shell-integrity.spec.ts --project=ipad-landscape --reporter=list
        timeout-minutes: 5
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-integrity-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Lighthouse CI smoke and baseline audit.
  # Chrome setup and report generation are release-critical;
  # current quality thresholds are warning-level pending CI artifact calibration.
  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
      - name: Verify Google Chrome
        run: /usr/bin/google-chrome --version
      - name: Lighthouse CI collect
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx lhci collect
        timeout-minutes: 10
      - name: Lighthouse CI assert
        run: npx lhci assert
        timeout-minutes: 5
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_id }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  # Fast release gate — runs all non-Playwright deterministic checks
  # from FAST_GATE (minus steps already done in verify job).
  # Delegates to verify-release.mjs to avoid drift between CI and local validation.
  release-gate:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fast release gate
        run: npm run verify:release:fast
