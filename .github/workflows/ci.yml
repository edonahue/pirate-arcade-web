name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Playwright tests — separate job so a test flake doesn't block the
  # build. Only chromium-desktop is run here; mobile-safari/mobile-chrome
  # and webkit-desktop are exercised locally before each release (see
  # TESTING.md and tests/TESTING_CHECKLIST.md).
  playwright:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Health/smoke tests (chromium-desktop)
        run: npx playwright test tests/browser-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Desktop input tests (chromium-desktop)
        run: npx playwright test tests/game-input-desktop.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Web-native game tests (chromium-desktop)
        run: npx playwright test tests/web-native-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Game prewarm tests (chromium-desktop)
        run: npx playwright test tests/game-prewarm.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 5
      - name: Captain's Log tests (chromium-desktop)
        run: npx playwright test tests/captains-log.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 3
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Lighthouse CI — performance budget audit on static pages and game shells.
  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
      - name: Debug Chrome
        run: |
          echo "=== Chrome Debug Info ==="
          echo "PATH: $PATH"
          echo "=== which commands ==="
          which google-chrome || echo "google-chrome not in PATH"
          which chrome || echo "chrome not in PATH"
          which chromium || echo "chromium not in PATH"
          which chromium-browser || echo "chromium-browser not in PATH"
          echo "=== version commands ==="
          google-chrome --version 2>/dev/null || echo "google-chrome --version failed"
          chrome --version 2>/dev/null || echo "chrome --version failed"
          chromium --version 2>/dev/null || echo "chromium --version failed"
          chromium-browser --version 2>/dev/null || echo "chromium-browser --version failed"
          echo "=== /usr/bin listing ==="
          ls -la /usr/bin/google-chrome 2>/dev/null || echo "No /usr/bin/google-chrome"
          ls -la /usr/bin/chrome 2>/dev/null || echo "No /usr/bin/chrome"
          ls -la /usr/bin/chromium 2>/dev/null || echo "No /usr/bin/chromium"
          ls -la /usr/bin/chromium-browser 2>/dev/null || echo "No /usr/bin/chromium-browser"
          echo "=== find chrome in /opt ==="
          find /opt -name "chrome" -type f 2>/dev/null | head -5 || echo "No chrome in /opt"
          echo "=== find chrome in /home ==="
          find /home -name "chrome" -type f 2>/dev/null | head -5 || echo "No chrome in /home"
          echo "=== env CHROME_PATH ==="
          echo "CHROME_PATH=$CHROME_PATH"
      - name: Lighthouse CI collect + assert
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx lhci collect && npx lhci assert
        timeout-minutes: 10

  # Fast release gate — runs all non-Playwright deterministic checks
  # from FAST_GATE (minus steps already done in verify job).
  # Delegates to verify-release.mjs to avoid drift between CI and local validation.
  release-gate:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fast release gate
        run: npm run verify:release:fast
