name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Complete release gate — runs all fast-gate deterministic checks.
  # Combines the old verify + release-gate + shell-integrity jobs into one
  # to eliminate the same-job duplicate build pattern.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: npm ci
      - name: Fast release gate
        run: npm run verify:release:fast

  # Python game tests — isolates each game's test suite in its own
  # subprocess to prevent sys.modules contamination between games.
  python-games:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: npm run test:python-games
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-logs-${{ github.run_id }}
          path: test-results/python-games/
          if-no-files-found: error
          retention-days: 7

  # Playwright tests — separate job so a test flake doesn't block the
  # build. Only chromium-desktop is run here; mobile-safari/mobile-chrome
  # and webkit-desktop are exercised locally before each release (see
  # TESTING.md and tests/TESTING_CHECKLIST.md).
  playwright:
    runs-on: ubuntu-latest
    needs: [verify, python-games]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Health/smoke tests (chromium-desktop)
        run: npx playwright test tests/browser-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Gameplay match tests (chromium-desktop)
        run: npx playwright test tests/*-match.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 15
      - name: Desktop input tests (chromium-desktop)
        run: npx playwright test tests/game-input-desktop.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Web-native game tests (chromium-desktop)
        run: npx playwright test tests/web-native-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Game prewarm tests (chromium-desktop)
        run: npx playwright test tests/game-prewarm.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 5
      - name: Captain's Log tests (chromium-desktop)
        run: npx playwright test tests/captains-log.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 3
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Browser shell test — intercepts Pygbag runtime to test the static loading
  # shell on chromium, WebKit mobile, and iPad. Covers a distinct runtime/browser
  # contract from the static shell-integrity check already in the fast gate.
  shell-test:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium + WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Shell integrity tests (chromium)
        run: npx playwright test tests/game-shell-integrity.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 5
      - name: Shell integrity tests (mobile-safari)
        run: npx playwright test tests/game-shell-integrity.spec.ts --project=mobile-safari --reporter=list
        timeout-minutes: 5
      - name: Shell integrity tests (ipad-landscape)
        run: npx playwright test tests/game-shell-integrity.spec.ts --project=ipad-landscape --reporter=list
        timeout-minutes: 5
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-test-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Lighthouse CI smoke and baseline audit.
  # Chrome setup and report generation are release-critical;
  # current quality thresholds are warning-level pending CI artifact calibration.
  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
      - name: Verify Google Chrome
        run: /usr/bin/google-chrome --version
      - name: Lighthouse CI collect
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx lhci collect
        timeout-minutes: 10
      - name: Lighthouse CI assert
        run: npx lhci assert
        timeout-minutes: 5
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_id }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
