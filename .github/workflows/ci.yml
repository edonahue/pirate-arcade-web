name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Playwright tests — separate job so a test flake doesn't block the
  # build. Only chromium-desktop is run here; mobile-safari/mobile-chrome
  # and webkit-desktop are exercised locally before each release (see
  # TESTING.md and tests/TESTING_CHECKLIST.md).
  playwright:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Health/smoke tests (chromium-desktop)
        run: npx playwright test tests/browser-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Desktop input tests (chromium-desktop)
        run: npx playwright test tests/game-input-desktop.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10

  # Fast release gate — runs all non-Playwright deterministic checks
  # from FAST_GATE (minus steps already done in verify job).
  release-gate:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: SEO audit
        run: npm run seo:audit
      - name: Copy tone
        run: npm run test:copy-tone
      - name: CSS tokens
        run: npm run test:css-tokens
      - name: Visual contrast
        run: npm run test:visual-contrast
      - name: Dependency hygiene
        run: npm run check:dependency-hygiene
      - name: Cloudflare headers
        run: npm run test:check-headers
      - name: Browser game consistency
        run: npm run test:browser-game-consistency
      - name: Browser game shells
        run: npm run test:browser-game-shells
      - name: Service worker compat
        run: npm run test:service-worker
      - name: Cache versioning
        run: npm run test:cache-versioning
      - name: Game HTML version consistency
        run: npm run test:game-versions
      - name: Archive parity
        run: npm run test:archive-parity
      - name: Audit game archives
        run: npm run audit:game-archives
      - name: Public domain art
        run: npm run test:public-domain-art
      - name: Game theming source
        run: npm run test:game-theming-source
      - name: Screenshot assets
        run: npm run test:screenshot-assets
      - name: Performance budgets
        run: npm run test:performance-budgets
