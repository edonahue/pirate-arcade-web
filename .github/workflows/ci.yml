name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Playwright tests — separate job so a test flake doesn't block the
  # build. Only chromium-desktop is run here; mobile-safari/mobile-chrome
  # and webkit-desktop are exercised locally before each release (see
  # TESTING.md and tests/TESTING_CHECKLIST.md).
  playwright:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Health/smoke tests (chromium-desktop)
        run: npx playwright test tests/browser-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Desktop input tests (chromium-desktop)
        run: npx playwright test tests/game-input-desktop.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Web-native game tests (chromium-desktop)
        run: npx playwright test tests/web-native-games.spec.ts --project=chromium-desktop --reporter=list
        timeout-minutes: 10
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Fast release gate — runs all non-Playwright deterministic checks
  # from FAST_GATE (minus steps already done in verify job).
  # Delegates to verify-release.mjs to avoid drift between CI and local validation.
  release-gate:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fast release gate
        run: npm run verify:release:fast
