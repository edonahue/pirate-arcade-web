version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Limit open PRs to keep the queue reviewable
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    # Ignore semver-major updates for all packages — major bumps require
    # dedicated CI compatibility passes and are deferred. Patch/minor updates
    # flow through normally via grouped PRs below.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Phaser 4 is a major engine migration (not a simple semver bump).
      # Pinned to 3.x until we decide to do a dedicated migration spike.
      - dependency-name: "phaser"
    groups:
      dev-deps-testing:
        dependency-type: "development"
        patterns:
          - "@playwright/test"
          - "@axe-core/playwright"
          - "playwright*"
          - "puppeteer-core"
          - "vitest"
          - "lighthouse"
          - "@lhci/cli"
          - "chai"
      dev-deps-astro:
        dependency-type: "development"
        patterns:
          - "astro"
          - "@astrojs/*"
          - "prettier*"
          - "prettier-plugin-astro"
      dev-deps-typescript:
        dependency-type: "development"
        patterns:
          - "typescript"
          - "typescript-*"
      dev-deps-build:
        dependency-type: "development"
        patterns:
          - "esbuild"
          - "vite"
          - "rollup"
          - "sharp"
      dev-deps-lint:
        dependency-type: "development"
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
      production-dependencies:
        dependency-type: "production"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    allow:
      - dependency-type: "direct"
        update-type: "version-update:semver-patch"
      - dependency-type: "direct"
        update-type: "version-update:semver-minor"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
